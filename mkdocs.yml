site_name: Meu Estudo para Concursos

theme:
  name: material
  language: pt-BR

nav:
  - Início: index.md

  - português:
      - Crase: portugues/crase.md
      - Conjunções: docs/portugues/conjuncoes.md
      - Pronomes: docs/portugues/pronomes.md
      - Verbos: docs/portugues/verbos.md
      - redação: docs/portugues/redacao.md
      - Analise Sintática: docs/portugues/sintatica.md

  - administrativo:
      - Agentes Públicos: docs/administrativo/agentes-publicos.md
      - Administração Pública: docs/administrativo/administracao.md
      - Direito Administrativo: docs/administrativo/dir-administrativo.md

 - constitucional:
      - Constituição: docs/constitucional/constituicao.md
      - Direitos Fundamentais: docs/constitucional/direitos-fundamentais.md
      - Poderes da União: docs/constitucional/poderes-uniao.md

  - informática:
      - Informática Básica: docs/informatica/informatica-basica.md

  - leis:
      - Lei 8.429/92: docs/leis/lei-8429.md
      - Lei 9.784/99: docs/leis/lei-9784.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
