site_name: Meu Estudo para Concursos

theme:
  name: material
  language: pt-BR

  palette:

    - scheme: default
      primary: grey
      accent: amber
      toggle:
        icon: material/weather-night
        name: Modo escuro

    - scheme: slate
      primary: black
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Modo claro

       
nav:
  - Início: index.md


  - Português:
      - Crase: portugues/crase.md
      - Conjunções: portugues/conjuncoes.md
      - Pronomes: portugues/pronomes.md
      - Verbos: portugues/verbos.md
      - redação: portugues/redacao.md
      - Analise Sintática: portugues/sintatica.md

  - Administrativo:
      - Agentes Públicos: administrativo/agentes-publicos.md
      - Administração Pública: administrativo/administracao.md
      - Direito Administrativo: administrativo/dir-administrativo.md

  - Constitucional:
      - Constituição: constitucional/constituicao.md
      - Direitos Fundamentais: constitucional/direitos-fundamentais.md
      - Poderes da União: constitucional/poderes-uniao.md

  - Informática:
      - Informática Básica: informatica/informatica-basica.md
      - Comandos Linux: informatica/comandoslinux.md
      - Malwares: informatica/malwares.md
      - Programas de Escritório:
        - Introdução: informatica/suite-escritorio/index.md
        - Word: informatica/suite-escritorio/word.md
        - Excel: informatica/suite-escritorio/excel.md
        - PowerPoint: informatica/suite-escritorio/powerpoint.md
     

  - Raciocínio Lógico:
      - Raciocínio Lógico: raciocinio-logico/raciocinio-logico1.md

  - Leis:
      - Lei 8.429/92: leis/lei-8429.md
      - Lei 9.784/99: leis/lei-9784.md
      - Lei 14.133/2021: leis/lei-14133.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
